name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Validate Money Fixtures
        run: python3 scripts/check-money-fixtures.py

      - name: Validate String Catalog
        run: |
          python3 -m json.tool Localizable.xcstrings > /dev/null
          mkdir -p /tmp/xcstrings-build
          xcrun xcstringstool compile --dry-run \
            --output-directory /tmp/xcstrings-build \
            Localizable.xcstrings

      - name: Resolve Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project 'AI 記帳.xcodeproj'

      - name: Select Available iOS Simulator
        run: |
          IOS_TEST_DEVICE_ID="$(python3 scripts/select-ios-simulator.py)"
          echo "IOS_TEST_DEVICE_ID=$IOS_TEST_DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$IOS_TEST_DEVICE_ID" -b

      - name: Build (iOS Simulator)
        run: |
          xcodebuild \
            -project 'AI 記帳.xcodeproj' \
            -scheme 'AI 記帳' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build | tee xcodebuild.log

      - name: Run Unit Tests (iOS Simulator)
        run: |
          xcodebuild \
            -project 'AI 記帳.xcodeproj' \
            -scheme 'AI 記帳' \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE_ID" \
            -parallel-testing-enabled NO \
            -resultBundlePath unit-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-test.log

      - name: Run Advance Structural UI Tests
        run: |
          xcodebuild \
            -project 'AI 記帳.xcodeproj' \
            -scheme 'AI 記帳 UI Automation' \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE_ID" \
            -parallel-testing-enabled NO \
            -only-testing:'AI 記帳UITests/AdvanceStructuralEditingUITests' \
            -resultBundlePath ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild-ui-test.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            xcodebuild-test.log
            xcodebuild-ui-test.log
            unit-tests.xcresult
            ui-tests.xcresult

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select relevant platform work
        id: scope
        run: python3 scripts/ci-scope.py android

      - name: Setup Java 17
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        if: steps.scope.outputs.run == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        if: steps.scope.outputs.run == 'true'
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;36.1.0"

      - name: Setup Gradle
        if: steps.scope.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Is Executable
        if: steps.scope.outputs.run == 'true'
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: steps.scope.outputs.run == 'true'
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace
        working-directory: android

      - name: Run Unit Tests
        if: steps.scope.outputs.run == 'true'
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1

      - name: Enable KVM
        if: steps.scope.outputs.run == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented UI Tests
        if: steps.scope.outputs.run == 'true'
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: ./android
          script: bash ../.github/scripts/run-android-instrumentation.sh

      - name: Upload Instrumentation Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android/app/build/reports/androidTests/diagnostics/**

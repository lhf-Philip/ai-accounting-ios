name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/scripts/run-android-instrumentation.sh'
      - 'scripts/run-android-regression.sh'
      - 'scripts/check-docs.py'
      - 'scripts/check-money-fixtures.py'
      - 'docs/TESTING.md'
      - 'docs/CI_CHECKLIST.md'
      - 'docs/DEVELOPMENT_GUIDE.md'
      - 'docs/RELEASING.md'
      - 'docs/specs/parity-test-vectors.md'
      - 'docs/specs/data-model.md'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - '.github/scripts/run-android-instrumentation.sh'
      - 'scripts/run-android-regression.sh'
      - 'scripts/check-docs.py'
      - 'scripts/check-money-fixtures.py'
      - 'docs/TESTING.md'
      - 'docs/CI_CHECKLIST.md'
      - 'docs/DEVELOPMENT_GUIDE.md'
      - 'docs/RELEASING.md'
      - 'docs/specs/parity-test-vectors.md'
      - 'docs/specs/data-model.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;36.1.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace
        working-directory: android

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain --stacktrace
        working-directory: android
        env:
          JAVA_TOOL_OPTIONS: -XX:TieredStopAtLevel=1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented UI Tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          working-directory: ./android
          script: bash ../.github/scripts/run-android-instrumentation.sh

      - name: Upload Instrumentation Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-failure-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/reports/androidTests/connected/**
            android/app/build/reports/androidTests/diagnostics/**
